name = "beatvision-ai-worker"
main = "src/index.ts"
compatibility_date = "2026-06-15"

[vars]
ALLOWED_ORIGIN = "https://beat-vision.vercel.app,https://beat-vision-theta.vercel.app,http://localhost:5173"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "MOTION_JOBS"
class_name = "BeatVisionMotionJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BeatVisionMotionJob"]
