name: Strict Modal Worker Cloud Release
on:
  push:
    branches: [repair/modal-strict-cloud-20261027]
    paths: [.github/workflows/modal-strict-cloud-release.yml]
permissions:
  contents: read
concurrency:
  group: bragoraforge-modal-worker-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'DaddyDom8249/BeatVision' && github.ref == 'refs/heads/repair/modal-strict-cloud-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require existing deployment credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo 'BLOCKED: configure MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as GitHub Actions secrets. No deployment attempted.' >&2
            exit 1
          fi
      - name: Check out the exact reviewed worker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f82c5ae60e28d374082c6545528b8fe7cd0aa05b
          persist-credentials: false
      - name: Verify release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f82c5ae60e28d374082c6545528b8fe7cd0aa05b
          echo '027b64c94ebcd507365c6c99ef86763aa81358eef201095630211a65e59ebfa3  providers/modal_motion/worker.py
          3959a781fc5aad4e692c30e208b0b20ff29cdf0cb87eed6e45736625fd65c6f9  providers/modal_motion/contracts.py' | sha256sum -c -
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned deployment and test dependencies
        run: python -m pip install --disable-pip-version-check modal==1.6.2 Pillow==11.3.0
      - name: Verify offline contracts before deployment
        run: |
          set -euo pipefail
          python -m unittest discover -s providers/modal_motion/tests -v
          python -m py_compile providers/modal_motion/contracts.py providers/modal_motion/worker.py
      - name: Verify existing app and deploy without inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: main
        run: |
          set -euo pipefail
          modal app list --json > /tmp/strict-modal-apps.json
          python - <<'PYTHON'
          import json
          apps = json.load(open('/tmp/strict-modal-apps.json'))
          assert any('ap-CopCZqKwTuk11VLpDSU0fH' in json.dumps(row) and 'bragoraforge-modal-motion-proof' in json.dumps(row) for row in apps), 'Expected existing Modal app not found'
          print('Existing Modal app verified')
          PYTHON
          modal deploy -m providers.modal_motion.worker
          echo 'STRICT_WORKER_DEPLOY_COMPLETED source=f82c5ae60e28d374082c6545528b8fe7cd0aa05b; no inference invoked; batch not resumed' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the real CPU API image without GPU inference
        timeout-minutes: 4
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: main
        run: |
          set -euo pipefail
          modal run -m providers.modal_motion.api_runtime_check
          echo 'MODAL_CPU_RUNTIME_STARTUP_PASS_NO_GPU; malformed submit/poll validation checked; no media generated' >> "$GITHUB_STEP_SUMMARY"
