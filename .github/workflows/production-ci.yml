name: BeatVision Production CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - run: python -m py_compile providers/modal_motion/worker.py providers/modal_motion/tests/staging_worker.py scripts/test/verify_multiprocess_contention.py
      - run: python -m unittest providers.modal_motion.tests.test_submit_concurrency -v
      - run: npm install
      - run: npm test
      - run: npm run production-audit
      - run: npm run build
      - run: test -f README.md && test -d src && test -d supabase
