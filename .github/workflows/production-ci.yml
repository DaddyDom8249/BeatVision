name: BeatVision Production CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/verify-release-snapshot.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run production-audit
      - run: npm run build
      - run: test -f README.md && test -d src && test -d supabase
