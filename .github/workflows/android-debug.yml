name: BeatVision Android debug APK
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for sdkmanager in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if test -x "$sdkmanager"; then
              "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
              found=1
              break
            fi
          done
          test "$found" = 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, debug APK, and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beatvision-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
