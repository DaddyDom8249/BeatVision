name: One-time Modal API startup repair
'on':
  push:
    branches:
    - feat/modal-duration-20261024
    paths:
    - .github/workflows/modal-api-startup-release-20261025.yml
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'push' && github.repository == 'DaddyDom8249/BeatVision' && github.ref == 'refs/heads/feat/modal-duration-20261024'
      && github.event.head_commit.message == 'Verify Modal API runtime repair 20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bragoraforge-modal-worker-release
      cancel-in-progress: false
    steps:
    - name: Check out the reviewed worker release
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ca9999fbe39802ffff3feb117d21c5f9efab5394
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install pinned deployment dependencies
      run: python -m pip install --disable-pip-version-check modal==1.6.2 Pillow==11.3.0
    - name: Verify the exact release before exposing credentials
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = ca9999fbe39802ffff3feb117d21c5f9efab5394

        python -m unittest discover -s providers/modal_motion/tests -v

        python -m py_compile providers/modal_motion/contracts.py providers/modal_motion/worker.py

        '
    - name: Verify the actual CPU API image without GPU inference
      timeout-minutes: 4
      env:
        MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        MODAL_ENVIRONMENT: main
      run: 'set -euo pipefail

        modal run -m providers.modal_motion.api_runtime_check

        '
