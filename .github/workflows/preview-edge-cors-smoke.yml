name: Live read-only Edge CORS preview smoke
on:
  push:
    branches:
      - repair/founder-preview-cors-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production/preview preflight on six live Edge functions
        run: node scripts/smoke/verify-edge-cors.mjs