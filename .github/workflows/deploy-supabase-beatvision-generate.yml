name: Deploy BeatVision Supabase Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/beatvision-generate/**"
      - ".github/workflows/deploy-supabase-beatvision-generate.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: mdofsinyofqbeapzfygu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase credentials are configured
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy beatvision-generate
        run: supabase functions deploy beatvision-generate --project-ref "$SUPABASE_PROJECT_ID"
