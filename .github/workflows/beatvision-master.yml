name: BeatVision master audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DaddyDom8249/BeatVision-arena
          path: BeatVision-arena
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/beatvision-master.mjs --skip-build
        env:
          BEATVISION_ARENA_DIR: ${{ github.workspace }}/BeatVision/BeatVision-arena
      - run: pnpm run build
  deploy-worker:
    if: github.ref == 'refs/heads/main'
    needs: audit
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-ai-worker/package.json
      - run: npm install --prefix cloudflare-ai-worker
      - run: npm install --global wrangler@latest
      - run: wrangler deploy
        working-directory: cloudflare-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
