name: Modal Motion Checks and Manual Deploy
on:
  pull_request:
    paths:
      - 'providers/modal_motion/**'
      - '.github/workflows/modal-motion-proof.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the reviewed duration worker; no GPU inference'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: modal-motion-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate Python source
        run: python -m py_compile providers/modal_motion/contracts.py providers/modal_motion/worker.py
      - name: Run offline contract regressions
        run: python -m unittest discover -s providers/modal_motion/tests -v
      - name: Start the API in an isolated environment without GPU dependencies
        run: |
          set -euo pipefail
          python -m venv /tmp/modal-api-startup
          /tmp/modal-api-startup/bin/pip install --disable-pip-version-check modal==1.6.2 'fastapi[standard]==0.139.2'
          /tmp/modal-api-startup/bin/python -m providers.modal_motion.api_startup_check
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.repository == 'DaddyDom8249/BeatVision' && github.ref == 'refs/heads/feat/modal-duration-20261024'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bragoraforge-modal-worker-release
      cancel-in-progress: false
    steps:
      - name: Check out the reviewed worker release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1cf4d10ea9067f62261b8f3652a3d296bdb4b583
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned deployment dependencies
        run: python -m pip install --disable-pip-version-check modal==1.6.2 Pillow==11.3.0
      - name: Verify the exact release before exposing credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1cf4d10ea9067f62261b8f3652a3d296bdb4b583
          python -m unittest discover -s providers/modal_motion/tests -v
          python -m py_compile providers/modal_motion/contracts.py providers/modal_motion/worker.py
      - name: Deploy the worker without invoking inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: main
        run: |
          set -euo pipefail
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo 'Missing MODAL_TOKEN_ID or MODAL_TOKEN_SECRET repository secret.' >&2
            exit 1
          fi
          modal deploy -m providers.modal_motion.worker
      - name: Record deployment scope
        run: |
          echo 'Worker deploy command succeeded for reviewed commit 1cf4d10ea9067f62261b8f3652a3d296bdb4b583.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No GPU inference requested. No app duration cap changed. No main merge.' >> "$GITHUB_STEP_SUMMARY"
