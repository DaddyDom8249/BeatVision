name: BeatVision iOS Ad Hoc signing
on:
  push:
    branches: [feature/ios-local-cut-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Require private Apple signing credentials
        env:
          P12: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_ADHOC_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROFILE" ]; then
            echo "::error::Apple signing credentials are not configured. Set Actions secrets APPLE_SIGNING_P12_BASE64, APPLE_SIGNING_P12_PASSWORD, APPLE_ADHOC_PROFILE_BASE64. An Apple Distribution certificate and matching Ad Hoc provisioning profile with registered device UDIDs are required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate iOS project without signing secrets in process environment
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          npx cap add ios
          npx cap sync ios
          test -d ios/App/App.xcodeproj
      - name: Import signing credentials, archive, export and verify IPA
        env:
          P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          TMP_SIGN="$(mktemp -d)"
          KEYCHAIN="$TMP_SIGN/beatvision-signing.keychain-db"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          INSTALLED_PROFILE=""
          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            if [ -n "$INSTALLED_PROFILE" ]; then rm -f "$INSTALLED_PROFILE"; fi
            rm -rf "$TMP_SIGN"
          }
          trap cleanup EXIT
          printf '%s' "$P12_BASE64" | base64 -D > "$TMP_SIGN/signing.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$TMP_SIGN/ad-hoc.mobileprovision"
          security cms -D -i "$TMP_SIGN/ad-hoc.mobileprovision" > "$TMP_SIGN/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$TMP_SIGN/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$TMP_SIGN/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$TMP_SIGN/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$TMP_SIGN/profile.plist")"
          if [ "$APP_ID" != "$TEAM_ID.com.beatvision.studio" ]; then
            echo "::error::Provisioning profile must match exact bundle identifier com.beatvision.studio and team ID."
            exit 1
          fi
          python3 - "$TMP_SIGN/profile.plist" <<'PY'
          import datetime, plistlib, sys
          with open(sys.argv[1], 'rb') as file:
              profile = plistlib.load(file)
          expiry = profile.get('ExpirationDate')
          if not expiry or expiry <= datetime.datetime.utcnow():
              raise SystemExit('::error::Apple provisioning profile is expired or missing expiration')
          devices = profile.get('ProvisionedDevices', [])
          if not devices:
              raise SystemExit('::error::Ad Hoc profile has no registered device UDIDs')
          if profile.get('Entitlements', {}).get('get-task-allow', True):
              raise SystemExit('::error::Expected distribution Ad Hoc profile, not a development profile')
          print('Ad Hoc provisioning profile checks passed; registered devices:', len(devices))
          PY
          mkdir -p "$PROFILES"
          INSTALLED_PROFILE="$PROFILES/$PROFILE_UUID.mobileprovision"
          cp "$TMP_SIGN/ad-hoc.mobileprovision" "$INSTALLED_PROFILE"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 14400 "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$TMP_SIGN/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution'; then
            echo "::error::PKCS#12 does not provide a valid Apple Distribution signing identity."
            exit 1
          fi
          ARGS=(-project ios/App/App.xcodeproj)
          if [ -d ios/App/App.xcworkspace ]; then
            ARGS=(-workspace ios/App/App.xcworkspace)
          fi
          ARCHIVE="$RUNNER_TEMP/BeatVision.xcarchive"
          xcodebuild "${ARGS[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY='Apple Distribution' archive
          test -f "$ARCHIVE/Products/Applications/App.app/Info.plist"
          codesign --verify --deep --strict "$ARCHIVE/Products/Applications/App.app"
          APP_TEAM_ID="$TEAM_ID" APP_PROFILE_NAME="$PROFILE_NAME" APP_EXPORT_OPTIONS="$TMP_SIGN/ExportOptions.plist" python3 - <<'PY'
          import os, plistlib
          payload = {
              'method': 'ad-hoc',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'teamID': os.environ['APP_TEAM_ID'],
              'provisioningProfiles': {
                  'com.beatvision.studio': os.environ['APP_PROFILE_NAME'],
              },
          }
          with open(os.environ['APP_EXPORT_OPTIONS'], 'wb') as file:
              plistlib.dump(payload, file)
          PY
          mkdir -p artifacts/signed
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$TMP_SIGN/ExportOptions.plist" \
            -exportPath artifacts/signed
          IPA="$(find artifacts/signed -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          if [ -z "$IPA" ]; then echo "::error::Signed IPA missing"; exit 1; fi
          mv "$IPA" artifacts/BeatVision-SIGNED-AdHoc.ipa
          mkdir "$TMP_SIGN/verify"
          (cd "$TMP_SIGN/verify" && unzip -q "$GITHUB_WORKSPACE/artifacts/BeatVision-SIGNED-AdHoc.ipa")
          codesign --verify --deep --strict "$TMP_SIGN/verify/Payload/App.app"
          test -f "$TMP_SIGN/verify/Payload/App.app/embedded.mobileprovision"
          echo 'Apple-signed Ad Hoc IPA; installs only on devices registered in the provisioning profile.' > artifacts/README-SIGNED-ADHOC.txt
          ls -lh artifacts/BeatVision-SIGNED-AdHoc.ipa
      - name: Upload signed Ad Hoc IPA
        uses: actions/upload-artifact@v4
        with:
          name: BeatVision-iOS-SIGNED-AdHoc
          path: |
            artifacts/BeatVision-SIGNED-AdHoc.ipa
            artifacts/README-SIGNED-ADHOC.txt
          if-no-files-found: error
          retention-days: 3
